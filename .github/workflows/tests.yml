name: tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    # `edited` incluye el cambio de rama base. Sin él, un PR apilado que GitHub
    # reapunta a develop al mergear su base se queda en amarillo para siempre:
    # el default de types es [opened, synchronize, reopened] y ninguno dispara.
    types: [opened, edited, synchronize, reopened]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject declara requires-python = ">=3.11". Probar solo 3.11 es prometer
      # tres versiones y verificar una.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Installs what pyproject DECLARES. Listing deps here by hand meant two lists
      # of the same thing, and the one nobody looks at is the one that drifts.
      - run: pip install -e . pytest
      # pytest descubre. Listar los archivos a mano hacía que un test nuevo se
      # saltara en silencio.
      - run: python -m pytest -q
      # Lo que queda de bash: el hook, con `gh` stubbeado y sin red. Las protecciones
      # ya no están acá — se portaron a Python y las cubre `tests/test_bootstrap.py`.
      - run: bash hooks/test-pr-comment-reminder.sh
      - run: bash -n skills/baton-ship/scripts/ship-pr.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Las reglas se declaran en pyproject.toml [tool.ruff.lint], no acá y no por
      # defaults: los defaults de ruff cambiaron entre 0.15 y 0.16, así que dejarlo
      # implícito hace que el lint mute solo cuando el runner actualiza.
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  # Job agregador, y el ÚNICO nombre que la branch protection tiene que conocer.
  # Una matriz reporta `pytest (3.11)`, `pytest (3.12)`… — nunca un check llamado
  # `pytest`. Si la protección exigiera los nombres de la matriz, agregar o sacar
  # una versión de Python rompería silenciosamente todo PR hasta que alguien con
  # admin actualizara la config. Acá el contexto requerido es siempre `test`, y la
  # matriz puede cambiar sin que nadie toque la protección.
  test:
    needs: [pytest, lint]
    if: always()          # sin esto, una matriz roja SALTEA este job y el check
    runs-on: ubuntu-latest #  requerido nunca reporta: el PR cuelga igual
    steps:
      - name: Gate
        run: |
          echo "pytest=${{ needs.pytest.result }}  lint=${{ needs.lint.result }}"
          [ "${{ needs.pytest.result }}" = "success" ] || exit 1
          [ "${{ needs.lint.result }}" = "success" ] || exit 1
