name: tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    # `edited` incluye el cambio de rama base. Sin él, un PR apilado que GitHub
    # reapunta a develop al mergear su base se queda en amarillo para siempre:
    # el default de types es [opened, synchronize, reopened] y ninguno dispara.
    types: [opened, edited, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python tests/test_smoke.py
      - run: python tests/test_plane_adapter.py
      - run: python tests/test_config.py
