[project]
name = "baton-board"          # `baton` está tomado en PyPI; el comando sigue siendo `baton`
version = "0.5.0"
description = "Work-item lifecycle from idea to shipped — agent- and backend-agnostic CLI + agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oscar Silva" }]
keywords = ["cli", "project-management", "plane", "claude-code", "opencode", "agent-skills"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
# markdown-it-py renders COMMENTS into the HTML field Plane stores them in. Item
# bodies stay literal markdown on purpose — see adapters/board/plane.py.
dependencies = ["pyyaml>=6", "markdown-it-py>=3"]

[project.urls]
Homepage = "https://github.com/SOSkr/baton"
Repository = "https://github.com/SOSkr/baton"
Issues = "https://github.com/SOSkr/baton/issues"

[project.scripts]
baton = "baton.cli:main"

[tool.ruff.lint]
# Explícito a propósito, no por gusto de configurar: los defaults de ruff NO son
# estables entre versiones —0.15 seleccionaba E4/E7/E9+F y 0.16 sumó I, RUF—, así
# que "sin config" significa que el lint cambia solo cuando el runner actualiza.
# Lo que se busca acá es `F`: en el PR #17 un import faltante pasó los 28 tests y
# solo apareció corriendo el CLI a mano. F821 lo agarra en dos segundos.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]
