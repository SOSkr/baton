[project]
name = "baton-board"          # `baton` está tomado en PyPI; el comando sigue siendo `baton`
version = "0.1.0"
description = "Work-item lifecycle from idea to shipped — agent- and backend-agnostic CLI + agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oscar Silva" }]
keywords = ["cli", "project-management", "plane", "claude-code", "opencode", "agent-skills"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/SOSkr/baton"
Repository = "https://github.com/SOSkr/baton"
Issues = "https://github.com/SOSkr/baton/issues"

[project.scripts]
baton = "baton.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]
