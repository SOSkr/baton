[project]
name = "baton"
version = "0.1.0"
description = "Work-item lifecycle over a board (GitHub Projects, Plane, ...) — backend-agnostic CLI + skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
baton = "baton.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]
