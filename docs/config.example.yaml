# baton — .baton/config.yaml, every key, with values.
#
# Copy it to your project and delete what you do not need:
#
#     mkdir -p .baton && cp docs/config.example.yaml .baton/config.yaml
#
# Or let `baton bootstrap` write the required half for you (see the baton-bootstrap
# skill) and add the rest by hand.
#
# Two rules hold everywhere in here:
#   1. NO IDS. Everything is a human-typed name; internal ids are discovered at runtime.
#      That is why this file is short and why moving workspace does not mean editing code.
#   2. NO TOKENS. `tokens:` holds the NAME of an env var, never a credential.
#
# `tests/test_docs.py` loads this file and checks every key against `Config`, so it
# cannot quietly fall behind the code the way a snippet in a README does.

# --- required -----------------------------------------------------------------------

adapters:              # which provider serves each adapter role. The value is the FILE
  board: kanboard      # NAME under src/baton/adapters/<role>/ — see docs/adapters/
  repo: github         # optional; github is the default
  read: github_projects  # only used by `baton export` during a migration

# Where the board is. THE KEYS DEPEND ON THE PROVIDER — this is the one place in the
# file that is not the same for everyone, so both are spelled out. Use one block.
#
# kanboard: there is no workspace and no short identifier. The project is its NAME,
#           exactly as the board shows it.
target:
  base_url: https://board.acme.com   # kanboard: instance URL, without /jsonrpc.php
  project: APP                       # kanboard: the project's NAME
  user: admin                        # kanboard: who comments are attributed to. The
                                     #   application token is not a user, so Kanboard
                                     #   cannot infer it. Optional when the board has
                                     #   exactly one admin; required past that, because
                                     #   guessing an author is worse than asking.

# plane: (delete the block above and use this one instead)
# target:
#   base_url: https://plane.acme.com   # plane: your instance
#   workspace: acme                    # plane: workspace slug
#   project: APP                       # plane: project identifier — the APP in APP-123

repo: acme/app         # where the CODE lives. The board knows nothing about git

# --- how the project is shaped ------------------------------------------------------

git:                   # branch names. Trunk-based? Point both at the same one
  integration: develop
  production: master

visibility: private    # `baton bootstrap` only: what a repo it CREATES is created as

board_stages:          # `baton bootstrap` only: the stages the board must have, in
  - Review             # board order. baton derives open/closed from each stage's
  - Approved           # lifecycle group, inferred here: everything before the stage
  - In Progress        # `stages.start` points at is unstarted, the last non-cancelled
  - Verify             # one is what "done" means, and a name like Cancelled is a
  - Deployed           # cancellation.
  - Cancelled
# When that guess would be wrong — a board in another language, two closing columns —
# write it as a mapping instead and be explicit (groups: backlog, unstarted, started,
# completed, cancelled):
#
#   board_stages: {Pendiente: unstarted, Haciendo: started,
#                  Desplegado: completed, Cancelado: cancelled}

stages:                # baton's lifecycle vocabulary -> what THIS board calls it.
  triage: Review       # where a new item lands, and the board's default stage
  approve: Approved    # Every key is optional; these are the defaults. Rename a column
  start: In Progress   # here and every command and skill follows, because they ask for
  verify: Verify       # `@approve`, never for a literal name. Declaring `verify` ALSO
  ship: Deployed       # gates it: a move that jumps OVER that stage is refused.
  cancel: Cancelled    # `baton doctor` checks each of these exists on the board

labels:                # the label AXES this project uses. Labels are axes, never state
  axes: [type, area]   # — state is the board stage

review_label: needs-review   # applied automatically on a BACKWARD stage move, so a
                             # step back is something a human sees

# --- multi-repo ---------------------------------------------------------------------

repos:                 # a board project can span several git repos; the `area:` label
  engine: acme/app-engine    # on an item says which one. Matches label `area:engine`
  web: acme/app-web

# --- credentials (names only, never values) -----------------------------------------

tokens:                  # the ENV VAR NAME to read per credential role. The agent writes
  agent: KANBOARD_TOKEN  # code and items; the admin creates and merges. See the README's
  admin: KANBOARD_TOKEN  # § Credential roles. GitHub always reads GH_TOKEN /
                         # GH_ADMIN_TOKEN, whichever provider holds the board.
                         #
                         # Both roles point at ONE var here on purpose: Kanboard has a
                         # single application token, not one per user, so the split
                         # cannot be real. That is the supported way to say so, and
                         # `doctor` then reports it as decorative instead of letting
                         # you assume it protects something.
                         #
                         # On Plane: {agent: PLANE_API_KEY, admin: PLANE_ADMIN_API_KEY}
                         # — and even there the split is real only when the two keys
                         # belong to two ACCOUNTS, since a key inherits its creator.

# --- optional wiring ----------------------------------------------------------------

migrate_from:          # the OLD board this project came from, read-only, for
  repo: acme/legacy    # `baton export`. Delete it once the migration is done
  project: 5

memory: app            # this project's name in your session-memory store, if you use one

projects:              # sibling boards you can query with `baton -p <name> ...`
  other: ../other-app  # relative to the PROJECT root (the dir holding .baton/)
